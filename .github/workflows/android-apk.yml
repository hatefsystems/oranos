name: Oranos CI Validation

# Safe lightweight validation on GitHub-hosted runners only.
# The persistent home runner is exclusively used by self-hosted-chromium.yml.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-apk.yml
      - .github/workflows/self-hosted-chromium.yml
      - .github/oranos-ci/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/android-apk.yml
      - .github/workflows/self-hosted-chromium.yml
      - .github/oranos-ci/**

permissions:
  contents: read

jobs:
  validate:
    name: Validate Chromium CI scripts (no browser build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            .github/oranos-ci
      - name: Validate CI files
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/oranos-ci/build-android.sh
          bash -n .github/oranos-ci/build-self-hosted.sh
          test -s .github/oranos-ci/README.md
          grep -Fq 'chrome_public_apk' .github/oranos-ci/build-self-hosted.sh
          grep -Fq 'workflow_dispatch:' .github/workflows/self-hosted-chromium.yml
          if grep -Eq '^  (pull_request|push):' .github/workflows/self-hosted-chromium.yml; then
            echo 'The home runner may only be dispatched manually.' >&2
            exit 1
          fi
          echo 'CI script validation passed. No Chromium build was performed.'
